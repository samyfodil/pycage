name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build guest and test
        run: make test
      - name: Check formatting
        run: test -z "$(gofmt -l -- *.go cmd/pycage/*.go)"
      - name: Vet
        run: go vet -stdmethods=false ./...
      - name: Cross-compile
        run: |
          for target in darwin/arm64 darwin/amd64 windows/amd64 linux/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/pycage
          done
      - name: Build examples
        # Separate modules, so the root build does not cover them.
        run: cd examples/langchain-agent && go build ./...
